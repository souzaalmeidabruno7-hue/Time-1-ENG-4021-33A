{% extends "base_auth.html" %}
{% block titulo %}Entrar{% endblock %}

{% block formulario %}
  <form action="{% url 'login' %}?next={{ request.GET.next|urlencode }}" method="post">
    {% csrf_token %}
    <h2 class="text-3xl font-bold tracking-tight text-ink">Bem-vindo de volta</h2>
    <p class="mt-2 text-sm text-ink-soft">Entre com seu usuário e senha para continuar</p>

    <div class="mt-8 space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-ink">Usuário</label>
        <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username"
               autocapitalize="none" spellcheck="false" required placeholder="seu.usuario"
               class="mt-2 w-full rounded-lg border border-line bg-white px-4 py-3 text-[0.95rem] text-ink outline-none transition placeholder:text-ink-soft/55 focus-visible:border-stage focus-visible:ring-2 focus-visible:ring-stage/25">
      </div>

      <div>
        <div class="flex items-baseline justify-between gap-3">
          <label for="password" class="block text-sm font-medium text-ink">Senha</label>
          <a href="{% url 'esqueci_senha' %}" class="text-xs font-medium text-stage underline-offset-4 hover:underline">Esqueci minha senha</a>
        </div>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"
               class="mt-2 w-full rounded-lg border border-line bg-white px-4 py-3 text-[0.95rem] text-ink outline-none transition placeholder:text-ink-soft/55 focus-visible:border-stage focus-visible:ring-2 focus-visible:ring-stage/25">
      </div>

      <label class="flex w-fit cursor-pointer items-center gap-2.5 text-sm text-ink">
        <input type="checkbox" name="remember" class="size-4 cursor-pointer rounded border-line accent-stage">
        Manter conectado
      </label>

      <button type="submit"
              class="w-full rounded-full bg-stage px-6 py-3 text-[0.95rem] font-semibold text-cream transition-colors hover:bg-stage-deep focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-stage focus-visible:ring-offset-2 focus-visible:ring-offset-cream">
        Entrar
      </button>
    </div>

    <p class="mt-8 text-center text-sm text-ink-soft">
      Não tem conta? <a href="{% url 'cadastro' %}" class="font-semibold text-stage underline-offset-4 hover:underline">Cadastre-se</a>
    </p>
    <p class="mt-3 text-center font-mono text-[11px] uppercase tracking-[0.12em] text-ink-soft">
      <a href="{% url 'index' %}" class="hover:text-ink">← Voltar para o site</a>
    </p>
  </form>
{% endblock %}
