{% extends "base.html" %}
{% block titulo %}Página não encontrada{% endblock %}

{% block corpo %}
  <main class="mx-auto max-w-2xl px-5 py-32 text-center">
    <p class="font-mono text-xs uppercase tracking-[0.2em] text-stage">Erro 404</p>
    <h1 class="mt-3 font-display text-5xl uppercase tracking-tight">Página não encontrada</h1>
    <p class="mt-4 text-ink-soft">A página que você procura não existe ou foi movida.</p>
    <a href="{% url 'index' %}" class="mt-8 inline-block rounded-full bg-ink px-6 py-3 text-sm font-semibold text-cream transition-colors hover:bg-stage">Voltar ao início</a>
  </main>
{% endblock %}
