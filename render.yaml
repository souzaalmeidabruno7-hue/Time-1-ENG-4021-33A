# Configuração de publicação do ArtConnect no Render (render.com)
# Cria o site (Django) e o banco PostgreSQL juntos.
services:
  - type: web
    name: artconnect
    runtime: python
    plan: free
    rootDir: Documentos/artconnect-django
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # migrate cria as tabelas; popular_banco só coloca os dados de exemplo se o banco estiver vazio
    startCommand: python manage.py migrate && python manage.py popular_banco && gunicorn ArtConnect.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: artconnect-db
          property: connectionString

databases:
  - name: artconnect-db
    plan: free
    databaseName: artconnect
